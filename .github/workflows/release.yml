name: Release

# Tags (vX.Y.Z[-pre]) build, sign and publish a release. Pushes to main build everything unsigned: the artifacts (kept 7 days)
# and the container image as ghcr.io/zyno-io/v8s:main and :<short sha>, which is what gets live-tested before tagging. A manual
# run builds any branch the same unsigned way (image :<branch> and :<short sha>). A pull request from this repository builds
# only the container image, amd64 only, as :pr-<number> and :pr-<number>-<short head sha>, to test on staging before merging.
# Signing, notarization, attestations, the Helm chart and the GitHub release happen on tags only. For a stable tag the
# publish job ends by dispatching www.yml to deploy v8s.io, so the site (download links, release.json for the update
# check) only names a release that exists. container-cleanup.yml prunes the non-release images.
on:
  push:
    branches: [main]
    # Site-only commits don't rebuild the app (www.yml deploys them). Path filters are not evaluated for tag pushes,
    # so every v* tag still builds and publishes a release.
    paths-ignore:
      - 'sites/www/**'
      - '.github/workflows/www.yml'
    tags: ['v*']
  pull_request:
    paths-ignore:
      - 'sites/www/**'
      - '.github/workflows/www.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Tag runs queue in one group (two release tags never race for :latest or "Latest"); branch runs are per ref, and a newer
  # push supersedes an unfinished one. A tag run is never cancelled.
  group: ${{ github.ref_type == 'tag' && 'v8s-release' || format('v8s-release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  YARN_ENABLE_SCRIPTS: 'false'
  YARN_ENABLE_TELEMETRY: '0'

jobs:
  meta:
    # Fork and Dependabot pull requests get a read-only token and cannot push the image.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      # 'true' on a tag: sign, notarize, attest, push the chart and publish. Anything else builds unsigned.
      tagged: ${{ steps.parse.outputs.tagged }}
      environment: ${{ steps.parse.outputs.environment }}
      images: ${{ steps.parse.outputs.images }}
    steps:
      - name: Parse ref
        id: parse
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          img=ghcr.io/zyno-io/v8s
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_EVENT_NAME" != push ]]; then
            echo "::error::Manual runs build branches only; to redo a release, re-run the tag's own run"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
            prerelease=false
            if [[ "$version" == *-* ]]; then prerelease=true; fi
            images="$img:$version"
            if [[ "$prerelease" != true ]]; then images+=$'\n'"$img:latest"; fi
            tagged=true
            environment=release
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Pull request: 0.0.0-pr-<n>.g<head sha>, built from the PR's head commit (not the merge commit).
            version="0.0.0-pr-${PR_NUMBER}.g${PR_SHA::7}"
            prerelease=true
            images="$img:pr-${PR_NUMBER}"$'\n'"$img:pr-${PR_NUMBER}-${PR_SHA::7}"
            tagged=false
            environment=''
          else
            # Branch build: 0.0.0-<branch>.g<sha> (the g keeps an all-digit sha a valid semver identifier).
            ref="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9-' '-' | cut -c1-100)"
            # The ref becomes an image tag and a semver identifier: it must start with a letter, and never shadow :latest.
            if ! [[ "$ref" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]] || [[ "$ref" == latest ]]; then
              echo "::error::Branch '$GITHUB_REF_NAME' cannot be used as an image tag (start it with a letter; 'latest' is reserved)"
              exit 1
            fi
            sha="g${GITHUB_SHA::7}"
            version="0.0.0-${ref}.${sha}"
            prerelease=true
            images="$img:$ref"$'\n'"$img:${GITHUB_SHA::7}"
            tagged=false
            environment=''
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "tagged=$tagged"
            echo "environment=$environment"
            echo 'images<<EOF'
            echo "$images"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "version $version, tagged $tagged"; echo "$images"

  ui:
    needs: meta
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - run: yarn workspace @v8s/ui build-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: packages/ui/dist
          if-no-files-found: error
          retention-days: 1

  # Static CLI binaries with the UI embedded. Linux and macOS cross-compile on ubuntu (macOS is signed with rcodesign and
  # notarized there); Windows builds on windows-latest so the exe can be signed with Azure Artifact Signing.
  cli:
    needs: [meta, ui]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    # The release environment (signing secrets) only on tags.
    environment: ${{ needs.meta.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest }
          - { goos: darwin, goarch: amd64, runner: ubuntu-latest }
          - { goos: darwin, goarch: arm64, runner: ubuntu-latest }
          - { goos: windows, goarch: amd64, runner: windows-latest }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui-dist

      - name: Build
        run: scripts/build-agent.sh --ui-dist ui-dist "$GOOS/$GOARCH"

      # --- macOS: sign (hardened runtime) and notarize with rcodesign, as sp2p does ---
      - name: Install rcodesign
        if: matrix.goos == 'darwin' && needs.meta.outputs.tagged == 'true'
        run: |
          RCODESIGN_VERSION="0.27.0"
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/rcodesign.tar.gz"
          echo "a0e0c548b313026abf4f40a6e06554d352c6f4e1add6a87d626c94134a4ee564  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP"/apple-codesign-*/rcodesign /usr/local/bin/

      - name: Sign and notarize (macOS)
        if: matrix.goos == 'darwin' && needs.meta.outputs.tagged == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/apple-cert.p12"
          pw="$RUNNER_TEMP/apple-cert-password"
          raw="$RUNNER_TEMP/api-key-raw.json"
          p8="$RUNNER_TEMP/apple-api-key.p8"
          key="$RUNNER_TEMP/app-store-connect-key.json"
          echo "$APPLE_CERTIFICATE_P12" | base64 -d > "$p12"
          printf '%s' "$APPLE_CERTIFICATE_PASSWORD" > "$pw"
          echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > "$raw"
          jq -r '.private_key' "$raw" > "$p8"
          rcodesign encode-app-store-connect-api-key "$(jq -r '.issuer_id' "$raw")" "$(jq -r '.key_id' "$raw")" "$p8" -o "$key"
          rm -f "$raw" "$p8"

          bin="dist/${GOOS}_${GOARCH}/v8s"
          rcodesign sign --p12-file "$p12" --p12-password-file "$pw" --code-signature-flags runtime "$bin"
          zip -j "$RUNNER_TEMP/notarize.zip" "$bin"
          # Apple's queue sometimes takes well over the 10-minute default.
          rcodesign notary-submit --api-key-file "$key" --wait --max-wait-seconds 3600 "$RUNNER_TEMP/notarize.zip"
          rm -f "$p12" "$pw" "$key"

      # --- Windows: Azure Artifact Signing (same account and service principal as sp2p) ---
      - name: Sign (Windows)
        if: matrix.goos == 'windows' && needs.meta.outputs.tagged == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: Signal24
          certificate-profile-name: zc-distribution
          files-folder: ${{ github.workspace }}\dist\windows_amd64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature (Windows)
        if: matrix.goos == 'windows' && needs.meta.outputs.tagged == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath dist\windows_amd64\v8s.exe
          if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }

      - name: Archive
        run: |
          set -euo pipefail
          name="v8s_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p release "stage/$name"
          cp LICENSE README.md "stage/$name/"
          if [[ "$GOOS" == windows ]]; then
            cp "dist/${GOOS}_${GOARCH}/v8s.exe" "stage/$name/"
            (cd stage && 7z a -tzip "../release/$name.zip" "$name" >/dev/null)
          else
            cp "dist/${GOOS}_${GOARCH}/v8s" "stage/$name/"
            tar czf "release/$name.tar.gz" -C stage "$name"
          fi
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ needs.meta.outputs.tagged == 'true' && 1 || 7 }}

  # Electron installers. Each runner first builds the matching agent into agent/bin/<os>-<arch>/.
  desktop:
    needs: [meta, ui]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    # The release environment (signing secrets) only on tags.
    environment: ${{ needs.meta.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, runner: macos-latest, targets: 'darwin/arm64 darwin/amd64', expect: 2 }
          - { name: windows, runner: windows-latest, targets: 'windows/amd64', expect: 1 }
          - { name: linux, runner: ubuntu-latest, targets: 'linux/amd64', expect: 1 }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: ./.github/actions/setup-js
      # Yarn build scripts are disabled, so fetch the Electron binary explicitly.
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: packages/ui/dist
      - name: Install rpm tooling
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Build agent
        run: scripts/build-agent.sh --no-ui --layout desktop ${{ matrix.targets }}
      - name: Build main process
        run: yarn workspace @v8s/desktop build

      - name: Package (macOS)
        if: matrix.name == 'macos'
        env:
          # electron-builder accepts the certificate base64-encoded in CSC_LINK.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TAGGED: ${{ needs.meta.outputs.tagged }}
        run: |
          set -euo pipefail
          if [[ "$TAGGED" == true ]]; then
            # Notarization wants the API key as a .p8 file plus key id and issuer.
            raw="$RUNNER_TEMP/api-key-raw.json"
            echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > "$raw"
            jq -r '.private_key' "$raw" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            APPLE_API_KEY_ID="$(jq -r '.key_id' "$raw")"
            APPLE_API_ISSUER="$(jq -r '.issuer_id' "$raw")"
            export APPLE_API_KEY_ID APPLE_API_ISSUER
            rm -f "$raw"
          else
            # Unsigned: no identity lookup, and notarization is skipped (electron-builder.yml).
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          yarn workspace @v8s/desktop exec electron-builder --mac --arm64 --x64 --publish never "-c.extraMetadata.version=$VERSION"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Package (Windows)
        if: matrix.name == 'windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TAGGED: ${{ needs.meta.outputs.tagged }}
        run: |
          set -euo pipefail
          config=electron-builder.yml
          if [[ "$TAGGED" != true ]]; then
            # Unsigned: the same config without azureSignOptions (the CLI cannot unset a key: "-c.x=null" is a string).
            config=electron-builder.unsigned.json
            (cd packages/desktop && node -e "const fs=require('fs'),c=require('js-yaml').load(fs.readFileSync('electron-builder.yml','utf8'));delete c.win.azureSignOptions;fs.writeFileSync('$config',JSON.stringify(c))")
          fi
          yarn workspace @v8s/desktop exec electron-builder --config "$config" --win --x64 --publish never "-c.extraMetadata.version=$VERSION"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: yarn workspace @v8s/desktop exec electron-builder --linux --x64 --publish never "-c.extraMetadata.version=$VERSION"

      # electron-builder only warns when an extraResources source is missing; fail instead of shipping an app without its agent.
      - name: Verify the agent is bundled
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          # Plain globs over the known output layouts: `find` can resolve to find.exe on Windows, and macOS runners
          # default to bash 3.2 (no globstar). Each pattern has a glob character so nullglob drops it when absent.
          shopt -s nullglob
          bins=(packages/desktop/release/mac*/v8s.app/Contents/Resources/agent/v8s
                packages/desktop/release/linux-unpacke[d]/resources/agent/v8s
                packages/desktop/release/win-unpacke[d]/resources/agent/v8s.exe)
          printf '%s\n' "${bins[@]}"
          found=${#bins[@]}
          if [[ "$found" -ne "$EXPECT" ]]; then
            echo "::error::Expected $EXPECT bundled agent binaries, found $found"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.rpm
          if-no-files-found: error
          retention-days: ${{ needs.meta.outputs.tagged == 'true' && 1 || 7 }}

  container:
    needs: meta
    runs-on: ubuntu-latest
    environment: ${{ needs.meta.outputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile builds the UI and cross-compiles the agent on the build platform, so no QEMU is needed.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Pull requests build amd64 only (staging is amd64): about half the build time.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ needs.meta.outputs.images }}
          build-args: VERSION=${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
      # Signed provenance (Sigstore) on tags only; branch images carry BuildKit's unsigned provenance and SBOM.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.meta.outputs.tagged == 'true'
        with:
          subject-name: ghcr.io/zyno-io/v8s
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The Helm chart is published as an OCI artifact next to the image (helm is preinstalled on ubuntu runners).
      - name: Package and push the Helm chart
        if: needs.meta.outputs.tagged == 'true'
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package charts/v8s --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/v8s-${VERSION}.tgz" oci://ghcr.io/zyno-io/charts

  publish:
    needs: [meta, cli, desktop, container]
    if: needs.meta.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write # dispatch www.yml (a workflow_dispatch sent with GITHUB_TOKEN does start a run)
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # checkout can leave an annotated tag as a lightweight ref; refetch it so the tag message is available for the notes.
      - name: Fetch tag object
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{cli-*,desktop-*}'
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          find . -maxdepth 1 -type f -printf '%P\n' | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          mapfile -t assets < <(find dist -maxdepth 1 -type f | LC_ALL=C sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${args[@]}" "${assets[@]}"
          fi
      # The release now exists with its assets, so the site may announce it (release.json is what agents read for
      # updates). Release candidates never deploy: their CHANGELOG section already names the unreleased version. The
      # Website run is watched, so a failed site deploy fails this release run instead of going unnoticed; re-running
      # this job is safe (upload --clobber, edit) and dispatches again.
      - name: Deploy v8s.io
        if: env.PRERELEASE != 'true'
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run www.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f target=production
          run=''
          for _ in $(seq 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow www.yml --event workflow_dispatch --branch "$TAG" \
              --created ">=$since" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [[ -n "$run" ]] && break
            sleep 5
          done
          [[ -n "$run" ]] || { echo "::error::the dispatched Website run did not appear"; exit 1; }
          echo "Website run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
