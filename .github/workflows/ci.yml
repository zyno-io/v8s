name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Benchmark smoke
        run: go test -run '^$' -bench . -benchtime 1x ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - run: yarn lint
      - run: yarn oxfmt --check .
      - run: yarn typecheck
      - run: yarn workspace @v8s/client test
      - run: yarn workspace @v8s/ui test
      - run: yarn workspace @v8s/ui build-only

  perf:
    name: Perf
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Informational for now. Flip this off once the A/B thresholds (packages/ui/perf/compare.ts) have been tuned on real runs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests need the base commit for the A/B worktree.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: ./.github/actions/setup-js
      - name: Install Playwright Chromium
        run: yarn workspace @v8s/ui playwright install --with-deps chromium
      # Pull requests: A/B against the base commit on this same runner, alternating runs, failing on the relative
      # difference. Absolute budgets on shared runners are too noisy to gate on (docs/performance.md section 11).
      - name: Check out base
        if: github.event_name == 'pull_request'
        env:
          YARN_ENABLE_SCRIPTS: 'false'
          YARN_ENABLE_TELEMETRY: '0'
          # Reuse the cache setup-js restored for the head checkout.
          YARN_CACHE_FOLDER: ${{ github.workspace }}/.yarn/cache
        # A pull_request checkout is the merge commit: its first parent is exactly the base the PR merges onto.
        run: |
          git worktree add ../base HEAD^1
          cd ../base
          yarn install --immutable
      - name: Perf A/B
        if: github.event_name == 'pull_request'
        working-directory: packages/ui
        run: node perf/ab.ts --base-dir ../../../base --rounds 3 --out-dir test-results/ab
      # Pushes to main: the absolute budgets, informational only. A noisy runner can stall for a few frames
      # (p95 16.8 ms, no long tasks, in other runs), so retry once: a real regression fails both runs.
      - name: Perf test (absolute budgets)
        if: github.event_name != 'pull_request'
        run: yarn test:perf || { echo "::warning::perf budgets missed; retrying once"; yarn test:perf; }
      - name: Print numbers
        if: always() && github.event_name != 'pull_request'
        run: |
          f=packages/ui/test-results/perf.json
          if [ -f "$f" ]; then
            jq . "$f"
            { echo '### Perf'; echo '```json'; jq . "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no $f"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf
          path: |
            packages/ui/test-results/perf.json
            packages/ui/test-results/ab/*.json
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - run: yarn docs:build
