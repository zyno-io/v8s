# Example values: Entra ID login, a cluster app with a certificate, three kinds of clusters, ingress with TLS.
config:
  publicUrl: https://v8s.example.com
  oidc:
    issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
    clientId: 11111111-1111-1111-1111-111111111111
    clientSecret:
      env: V8S_OIDC_CLIENT_SECRET
    groupsClaim: groups
  clusterApp:
    clientId: 22222222-2222-2222-2222-222222222222
    privateKey:
      file: /etc/v8s/secrets/cluster-app/tls.key
    certificate:
      file: /etc/v8s/secrets/cluster-app/tls.crt
  adminGroups: ["33333333-3333-3333-3333-333333333333"]
  clusters:
    - id: prod-eu
      name: Production EU
      server: https://k8s.prod-eu.example.com
      caFile: /etc/v8s/secrets/ca/prod-eu.crt
      groups: ["44444444-4444-4444-4444-444444444444"]
      displayGroups: [Production]
    - id: legacy
      server: https://10.0.0.1:6443
      strategy: impersonation
      impersonation:
        token:
          file: /etc/v8s/secrets/legacy/token
      groups: ["55555555-5555-5555-5555-555555555555"]
    - id: wallboard
      server: https://k8s.example.com
      strategy: kiosk
      kiosk:
        token:
          file: /etc/v8s/secrets/kiosk/token
      groups: ["*"]
secretEnv:
  - name: V8S_OIDC_CLIENT_SECRET
    secretName: v8s-oidc
    key: client-secret
secretMounts:
  - name: cluster-app
    secretName: v8s-cluster-app
    mountPath: /etc/v8s/secrets/cluster-app
  - name: ca
    secretName: v8s-cluster-ca
    mountPath: /etc/v8s/secrets/ca
  - name: legacy
    secretName: v8s-legacy-impersonator
    mountPath: /etc/v8s/secrets/legacy
  - name: kiosk
    secretName: v8s-kiosk
    mountPath: /etc/v8s/secrets/kiosk
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    secretName: v8s-tls
