# Deliberately broken workloads: each one should surface as a v8s problem.
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments-api, namespace: payments, labels: { app: payments-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments-api } }
  template:
    metadata: { labels: { app: payments-api } }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 3; echo boom >&2; exit 1"]   # pod.crashloop
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: search-api, namespace: search, labels: { app: search-api } }
spec:
  replicas: 1
  selector: { matchLabels: { app: search-api } }
  template:
    metadata: { labels: { app: search-api } }
    spec:
      containers:
        - name: api
          image: registry.invalid/search/api:1.42.0                             # pod.image-pull
---
apiVersion: v1
kind: Service
metadata: { name: search-api, namespace: search }
spec: { selector: { app: search-api }, ports: [{ port: 80, targetPort: 8080 }] } # service.no-endpoints
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: search-public, namespace: search }
spec:
  rules:
    - host: search.example.test
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: search-api, port: { number: 80 } } } }] } # ingress.no-backend
---
apiVersion: v1
kind: Pod
metadata: { name: too-big, namespace: payments }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources: { requests: { cpu: "64" } }                                    # pod.pending (Unschedulable)
---
apiVersion: v1
kind: Pod
metadata: { name: memory-hog, namespace: payments }
spec:
  restartPolicy: Always
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "x=a; while true; do x=$x$x; done"]
      resources: { limits: { memory: 32Mi } }                                   # pod.oomkilled
---
apiVersion: batch/v1
kind: Job
metadata: { name: nightly-export, namespace: reporting }
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers: [{ name: export, image: busybox:1.36, command: ["sh", "-c", "exit 3"] }] # job.failed
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: hourly-report, namespace: reporting }
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers: [{ name: r, image: busybox:1.36, command: ["sh", "-c", "exit 1"] }] # cronjob.last-failed
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: elastic-data-2, namespace: payments }
spec: { storageClassName: fast-ssd, accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } } # pvc.pending
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-api, namespace: payments, labels: { app: catalog-api } }
spec:
  replicas: 3
  selector: { matchLabels: { app: catalog-api } }
  template:
    metadata: { labels: { app: catalog-api } }
    spec:
      containers: [{ name: api, image: nginx:1.25.3 }]                          # healthy (and a Trivy target)
