# Minimal IP-only CRDs for the IP search e2e (agent/test/e2e/g4_ipsearch_test.go): a MetalLB IPAddressPool and a
# Multus NetworkAttachmentDefinition, each with one object. The schemas preserve unknown fields; the real CRDs
# are not needed, only the group, version and resource names the agent's netkinds read.
# cluster.sh applies this file twice: the CRDs first, the objects once they are established.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipaddresspools.metallb.io
spec:
  group: metallb.io
  names: { kind: IPAddressPool, listKind: IPAddressPoolList, plural: ipaddresspools, singular: ipaddresspool }
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema: { type: object, x-kubernetes-preserve-unknown-fields: true }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  names:
    kind: NetworkAttachmentDefinition
    listKind: NetworkAttachmentDefinitionList
    plural: network-attachment-definitions
    singular: network-attachment-definition
    shortNames: [net-attach-def]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema: { type: object, x-kubernetes-preserve-unknown-fields: true }
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: e2e-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.100.0/24
    - 192.168.200.10-192.168.200.50
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: e2e-macvlan
  namespace: payments
spec:
  config: '{"cniVersion":"0.3.1","type":"macvlan","master":"eth0","ipam":{"type":"host-local","subnet":"192.168.77.0/24","rangeStart":"192.168.77.2","rangeEnd":"192.168.77.251","gateway":"192.168.77.1"}}'
