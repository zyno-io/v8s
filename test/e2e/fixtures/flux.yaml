apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: { name: podinfo, namespace: flux-system }
spec: { interval: 5m, url: https://github.com/stefanprodan/podinfo, ref: { branch: master } }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: podinfo, namespace: flux-system }
spec:
  interval: 10m
  targetNamespace: podinfo-flux
  path: ./kustomize
  prune: true
  sourceRef: { kind: GitRepository, name: podinfo }
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: { name: platform, namespace: flux-system }
spec: { interval: 1m, url: https://github.invalid/example/platform, ref: { branch: main } }   # flux.source-failed
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: platform, namespace: flux-system }
spec:
  interval: 10m
  path: ./
  prune: true
  sourceRef: { kind: GitRepository, name: platform }                          # flux.not-ready (dependency)
