// A wire-compatible subset of cilium's api/v1/observer/observer.proto: GetFlows, GetNodes and ServerStatus.
syntax = "proto3";

package observer;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "flow.proto";

option go_package = "github.com/zyno-io/v8s/agent/internal/hubble/pb";

service Observer {
  rpc GetFlows(GetFlowsRequest) returns (stream GetFlowsResponse) {}
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse) {}
  rpc ServerStatus(ServerStatusRequest) returns (ServerStatusResponse) {}
}

message ServerStatusRequest {}

message ServerStatusResponse {
  uint64 num_flows = 1;
  uint64 max_flows = 2;
  uint64 seen_flows = 3;
  uint64 uptime_ns = 4;
  google.protobuf.UInt32Value num_connected_nodes = 5;
  google.protobuf.UInt32Value num_unavailable_nodes = 6;
  repeated string unavailable_nodes = 7;
  string version = 8;
  double flows_rate = 9;
}

message GetNodesRequest {}

message Node {
  string name = 1;
  string version = 2;
  string address = 3;
  int32 state = 4;
}

message GetNodesResponse {
  repeated Node nodes = 1;
}

message GetFlowsRequest {
  uint64 number = 1;
  bool follow = 3;
  repeated flow.FlowFilter blacklist = 5;
  repeated flow.FlowFilter whitelist = 6;
  google.protobuf.Timestamp since = 7;
  google.protobuf.Timestamp until = 8;
  bool first = 9;
}

message LostEvent {
  int32 source = 1;
  uint64 num_events_lost = 2;
}

message GetFlowsResponse {
  oneof response_types {
    flow.Flow flow = 1;
    LostEvent lost_events = 3;
  }
  string node_name = 1000;
  google.protobuf.Timestamp time = 1001;
}
