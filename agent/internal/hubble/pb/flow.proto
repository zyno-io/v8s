// A wire-compatible subset of cilium's api/v1/flow/flow.proto (field numbers and names as upstream): only
// what the v8s agent reads or filters on. Unknown fields sent by the relay are skipped by proto3.
syntax = "proto3";

package flow;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/zyno-io/v8s/agent/internal/hubble/pb";

enum Verdict {
  VERDICT_UNKNOWN = 0;
  FORWARDED = 1;
  DROPPED = 2;
  ERROR = 3;
  AUDIT = 4;
  REDIRECTED = 5;
  TRACED = 6;
  TRANSLATED = 7;
}

enum TrafficDirection {
  TRAFFIC_DIRECTION_UNKNOWN = 0;
  INGRESS = 1;
  EGRESS = 2;
}

enum L7FlowType {
  UNKNOWN_L7_TYPE = 0;
  REQUEST = 1;
  RESPONSE = 2;
  SAMPLE = 3;
}

message Workload {
  string name = 1;
  string kind = 2;
}

message Endpoint {
  uint32 ID = 1;
  uint32 identity = 2;
  string cluster_name = 7;
  string namespace = 3;
  repeated string labels = 4;
  string pod_name = 5;
  repeated Workload workloads = 6;
}

message TCP {
  uint32 source_port = 1;
  uint32 destination_port = 2;
}

message UDP {
  uint32 source_port = 1;
  uint32 destination_port = 2;
}

message ICMPv4 {
  uint32 type = 1;
  uint32 code = 2;
}

message ICMPv6 {
  uint32 type = 1;
  uint32 code = 2;
}

message Layer4 {
  oneof protocol {
    TCP TCP = 1;
    UDP UDP = 2;
    ICMPv4 ICMPv4 = 3;
    ICMPv6 ICMPv6 = 4;
  }
}

message IP {
  string source = 1;
  string destination = 2;
}

message Service {
  string name = 1;
  string namespace = 2;
}

message HTTPHeader {
  string key = 1;
  string value = 2;
}

message HTTP {
  uint32 code = 1;
  string method = 2;
  string url = 3;
  string protocol = 4;
  repeated HTTPHeader headers = 5;
}

message DNS {
  string query = 1;
  repeated string ips = 2;
  uint32 ttl = 3;
  repeated string cnames = 4;
  string observation_source = 5;
  uint32 rcode = 6;
  repeated string qtypes = 7;
  repeated string rrtypes = 8;
}

message Layer7 {
  L7FlowType type = 1;
  uint64 latency_ns = 2;
  oneof record {
    DNS dns = 100;
    HTTP http = 101;
  }
}

message Flow {
  google.protobuf.Timestamp time = 1;
  Verdict verdict = 2;
  IP ip = 5;
  Layer4 l4 = 6;
  Endpoint source = 8;
  Endpoint destination = 9;
  string node_name = 11;
  repeated string source_names = 13;
  repeated string destination_names = 14;
  Layer7 l7 = 15;
  Service source_service = 20;
  Service destination_service = 21;
  TrafficDirection traffic_direction = 22;
  int32 drop_reason_desc = 25;
  google.protobuf.BoolValue is_reply = 26;
}

message FlowFilter {
  repeated string source_ip = 1;
  repeated string source_pod = 2;
  repeated string destination_ip = 3;
  repeated string destination_pod = 4;
  repeated Verdict verdict = 5;
  repeated string source_fqdn = 7;
  repeated string destination_fqdn = 8;
  repeated string http_status_code = 9;
  repeated string protocol = 12;
  repeated string dns_query = 18;
  repeated Workload source_workload = 26;
  repeated Workload destination_workload = 27;
  repeated TrafficDirection traffic_direction = 30;
  repeated int32 drop_reason_desc = 33;
}
